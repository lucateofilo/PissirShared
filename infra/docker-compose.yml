# Avvio: docker compose -f infra/docker-compose.yml up -d
# Prima bisogna creare i certificati con infra/certs/genera-certificati.sh
# Per ricreare il database da zero: docker compose -f infra/docker-compose.yml down -v
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - ./certs:/mosquitto/config/certs:ro
      - mosquitto-data:/mosquitto/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rail
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - postgres-data:/var/lib/postgresql/data

volumes:
  mosquitto-data:
  postgres-data:
